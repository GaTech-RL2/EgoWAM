# RoboTwin WM training entrypoint -- every non-flow run, single or cross embodiment.
#
# The data_schematic below is a UNION over all RoboTwin embodiments, so entries for
# embodiments a given run has no dataset for are simply unused. That is the same trick
# the per-task cross configs already relied on (pick uses the aloha/arx/piper/ur5 set).
#
# Select the run by overriding model= and data=:
#   single  model=robotwin/hpt_wm_rt_aloha_{vae,rae,hpt}   data=robotwin/aloha_single
#   cross   model=robotwin/hpt_wm_rt_cross_aloha_arx_piper_ur5_{vae,rae,hpt}
#           data=robotwin/pick_cross
#
# For 3D-flow runs add flow3d=point3d_rt; the keys live in a config group rather than the
# base schematic because a declared flow key with no point_flow_root raises KeyError
# (zarr_dataset_multi.py:1103).
defaults:
- model: robotwin/hpt_wm_rt_cross_aloha_arx_piper_ur5_vae
- paths: default
- trainer: ddp
- debug: null
- logger: wandb
- data: robotwin/pick_cross
- callbacks: checkpoints
- _self_
- flow3d: none
- override hydra/launcher: submitit
name: rt_cross
description: rt_cross
ckpt_path: null
train: true
eval: false
validate: false
eval_class:
  _target_: egowam.scripts.evaluation.Eve
  mode: real
  arm: both
  eval_path: ./logs/eval/${name}_${now:%Y-%m-%d_%H-%M-%S}
hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
launch_params:
  gpus_per_node: 1
  nodes: 1
trainer:
  limit_val_batches: 100
data_schematic:
  _target_: egowam.rldb.zarr.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    robotwin_aloha_bimanual:
      front_img_1:
        key_type: camera_keys
        zarr_key: observations.images.front_img_1
      right_wrist_img:
        key_type: camera_keys
        zarr_key: observations.images.right_wrist_img
      left_wrist_img:
        key_type: camera_keys
        zarr_key: observations.images.left_wrist_img
      future_front_img_1:
        key_type: camera_keys
        zarr_key: future.observations.images.front_img_1
      ee_pose:
        key_type: proprio_keys
        zarr_key: observations.state.ee_pose
      future_ee_pose:
        key_type: proprio_keys
        zarr_key: future.observations.state.ee_pose
      actions_cartesian:
        key_type: action_keys
        zarr_key: actions_cartesian
      embodiment:
        key_type: metadata_keys
        zarr_key: metadata.embodiment
    robotwin_arx_bimanual:
      front_img_1:
        key_type: camera_keys
        zarr_key: observations.images.front_img_1

_target_: egowam.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  eva_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/eva_bag_groceries
      key_map:
        _target_: egowam.rldb.embodiment.eva.Eva.get_keymap
      transform_list:
        _target_: egowam.rldb.embodiment.eva._build_eva_bimanual_transform_list
    filters: 
      task: "EgoWAM_bag_groceries"
      scene: "white_wall"
      robot_name: "eva_bimanual"
    mode: train

  aria_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/aria_bag_groceries_everse
      key_map:
        _target_: egowam.rldb.embodiment.human.Aria.get_keymap
      transform_list:
        _target_: egowam.rldb.embodiment.human.Aria.get_transform_list
    filters:
      task: "bag_groceries"
      robot_name: "aria_bimanual"
    mode: train

valid_datasets:
  eva_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/eva_bag_groceries
      key_map:
        _target_: egowam.rldb.embodiment.eva.Eva.get_keymap
      transform_list:
        _target_: egowam.rldb.embodiment.eva._build_eva_bimanual_transform_list
    filters: 
      task: "EgoWAM_bag_groceries"
      scene: "white_wall"
      robot_name: "eva_bimanual"
    mode: valid
  
  aria_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/aria_bag_groceries_everse
      key_map:
        _target_: egowam.rldb.embodiment.human.Aria.get_keymap
      transform_list:
        _target_: egowam.rldb.embodiment.human.Aria.get_transform_list
    filters:
      task: "bag_groceries"
      robot_name: "aria_bimanual"
    mode: valid

train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10
  aria_bimanual:
    batch_size: 32
    num_workers: 10

valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10
  aria_bimanual:
    batch_size: 32
    num_workers: 10

  eva_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/eva_fold_clothes
      key_map:
        _target_: egowam.rldb.embodiment.eva.Eva.get_keymap
        action_horizon: 45
        use_future: true
      transform_list:
        _target_: egowam.rldb.embodiment.eva._build_eva_bimanual_transform_list
        chunk_length: 100
        use_future: true
    filters:
      task: "EgoWAM_fold_clothes"
      scene: "white_wall"
      robot_name: "eva_bimanual"
    mode: valid

  aria_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/aria_fold_clothes
      key_map:
        _target_: egowam.rldb.embodiment.human.Aria.get_keymap
        action_horizon: 30
        use_future: true
      transform_list:
        _target_: egowam.rldb.embodiment.human.Aria.get_transform_list
        chunk_length: 100
        use_future: true
    filters:
      task: "EgoWAM_fold_clothes"
      scene: "white_wall"
      robot_name: "aria_bimanual"
    mode: valid

train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10
  aria_bimanual:
    batch_size: 32
    num_workers: 10

valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10
  aria_bimanual:
    batch_size: 32
    num_workers: 10

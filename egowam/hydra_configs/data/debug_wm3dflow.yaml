train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 4
  aria_bimanual:
    batch_size: 32
    num_workers: 4
valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 4
  aria_bimanual:
    batch_size: 32
    num_workers: 4

# cup_saucer robot-only BC. Same episodes as eva_wm.yaml without the future keys,
# mirroring bag_grocery/eva.yaml and fold_clothes/eva.yaml.
_target_: egowam.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  eva_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/eva_cup_saucer
      key_map:
        _target_: egowam.rldb.embodiment.eva.Eva.get_keymap
        action_horizon: 45
      transform_list:
        _target_: egowam.rldb.embodiment.eva._build_eva_bimanual_transform_list
        chunk_length: 100
    filters: 
      task: "EgoWAM_cup_on_saucer"
      scene: "white_wall"
      robot_name: "eva_bimanual"
    mode: train

valid_datasets:
  eva_bimanual:
    _target_: egowam.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egowam.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.data_root}/eva_cup_saucer
      key_map:
        _target_: egowam.rldb.embodiment.eva.Eva.get_keymap
        action_horizon: 45
      transform_list:
        _target_: egowam.rldb.embodiment.eva._build_eva_bimanual_transform_list
        chunk_length: 100
    filters: 
      task: "EgoWAM_cup_on_saucer"
      scene: "white_wall"
      robot_name: "eva_bimanual"
    mode: valid

train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10

valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 10

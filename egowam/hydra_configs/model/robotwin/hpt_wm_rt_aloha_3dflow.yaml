# 3D-FLOW variant: the HPT baseline PLUS a Track4World 3D point-flow world-model
# head (future_flow_3d_points). Apples-to-apples with VAE/RAE — same trunk +
# future-proprio aux head, but the WM head predicts sparse 3D point motion
# (N=560 pts, k=45 -> resampled to FLOW_CHUNK_LENGTH=100) instead of image latents.
# No Cosmos/RAE encoder needed (the flow decoder is a standalone DiT).
_target_: egowam.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egowam.algo.hpt_wm.HPT
  data_schematic: _${data.dataset.data_schematic}
  camera_transforms:
    robotwin_aloha_bimanual:
      _target_: egowam.utils.egowamUtils.CameraTransforms
      intrinsics_key: "robotwin"
      extrinsics_key: "robotwin"

  diffusion: true
  6dof: true

  ac_keys:
    robotwin_aloha_bimanual: "actions_cartesian"

  # Future-proprio aux head (shared with HPT baseline) + 3D point-flow WM head.
  auxiliary_ac_keys:
    robotwin_aloha_bimanual: ["future_ee_pose", "future_flow_3d_points"]
  auxiliary_loss_weights:
    future_ee_pose: 1.0
    future_image_latent: 0.0
    future_flow: 0.0
    future_flow_2d_points: 0.0
    future_flow_3d_points: 1.0
  future_proprio_key: "future_ee_pose"
  future_image_keys: []
  future_flow_key: "future_flow"
  wm_prediction_mode: "joint"
  teacher_forcing_ratio: 1.0
  training_stage: 3

  use_shared_vae_stem: false
  vae_stem_projection: "linear"
  # 3D point-flow decoder is standalone (no image latent) -> no VAE/RAE encoder.
  cosmos_vae: null

  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: "joint_token"
    observation_horizon: 1
    action_horizon: 64
    future_horizon: 16
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8

  domains: ["robotwin_aloha_bimanual"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256

  stem_specs:
    robotwin_aloha_bimanual:
      left_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      right_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    robotwin_aloha_bimanual:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        robotwin_aloha_bimanual: 14
      model:
        _target_: egowam.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    robotwin_aloha_bimanual_future_ee_pose:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 1
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        robotwin_aloha_bimanual: 14
      model:
        _target_: egowam.models.denoising_nets.CrossTransformer
        nblocks: 4
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 1
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    robotwin_aloha_bimanual_future_flow_3d_points:
      _target_: egowam.models.fm_policy.PointFMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100            # = FLOW_CHUNK_LENGTH (native k=45 resampled)
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        robotwin_aloha_bimanual: [100, 560, 3]  # [FLOW_CHUNK_LENGTH, N, point_dim]
      model:
        _target_: egowam.models.point_flow_decoder.PointFlowDecoder
        num_points: 560            # Track4World samples 560 pts/episode (constant)
        point_dim: 3
        action_horizon: 100
        cond_dim: 256
        hidden_dim: 256
        n_blocks: 4
        n_heads: 4
        mlp_ratio: 4.0
        dropout: 0.0
        time_dim: 256

  encoder_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    right_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    left_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5

_target_: egowam.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egowam.algo.hpt_wm.HPT
  data_schematic: _${data.dataset.data_schematic}
  camera_transforms:
    aria_bimanual:
      _target_: egowam.utils.egowamUtils.CameraTransforms
      intrinsics_key: "base" # change to base_half if using half res
      extrinsics_key: "x5Dec13_2"
    eva_bimanual:
      _target_: egowam.utils.egowamUtils.CameraTransforms
      intrinsics_key: "base" # change to base_half if using half res
      extrinsics_key: "x5Dec13_2"

  diffusion: true
  6dof: true

  ac_keys:
    eva_bimanual: "actions_cartesian"
    aria_bimanual: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  auxiliary_ac_keys:
    eva_bimanual: ["future_image_latent"]
    aria_bimanual: ["future_image_latent"]
  shared_auxiliary_ac_keys: ["future_image_latent"]
  auxiliary_loss_weights:
    future_ee_pose: 0.0
    future_image_latent: 1.0
    future_flow: 0.0
  future_proprio_key: "future_ee_pose"
  future_image_keys: ["future_front_img_1"]
  future_image_latent_key: "future_image_latent"
  future_flow_key: "future_flow"
  future_image_resize: 128
  wm_prediction_mode: "joint" # ["autoregressive", "joint", "teacher_forcing"]
  teacher_forcing_ratio: 1.0 # used for "teacher_forcing" mode
  training_stage: 3 # 1=aux-heads-only, 2=action-head-only, 3=joint (all heads)

  use_shared_vae_stem: false
  vae_stem_projection: "linear" # ["truncate", "linear"]
  cosmos_vae:
    _target_: egowam.models.cosmos_vae.CosmosVAEWrapper
    vae_pth: "hf://nvidia/Cosmos-Predict2-2B-Video2World/tokenizer/tokenizer.pth"
    chunk_duration: 1
    freeze: true

  kinematics_solver:
    _target_: egowam.robot.eva.eva_kinematics.EvaMinkKinematicsSolver
    model_path: ${paths.work_dir}/egowam/resources/model_x5.xml

  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: "joint_token" # ["action_token", "joint_token"]
    observation_horizon: 1
    action_horizon: 64
    future_horizon: 16 # number of distinct future query tokens # TODO: explore the future tokenization design
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: "" # TODO
  reverse_kl_samples: 8

  domains: ["eva_bimanual", "aria_bimanual"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256

  stem_specs:
    aria_bimanual:
      state_ee_pose:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
    eva_bimanual:
      left_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      right_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    aria_bimanual: null
    eva_bimanual: null
    shared:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 14
        aria_bimanual: 14
      model:
        _target_: egowam.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    shared_future_ee_pose:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 1
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        aria_bimanual: 14
        eva_bimanual: 14
      model:
        _target_: egowam.models.denoising_nets.CrossTransformer
        nblocks: 4
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 1
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    shared_future_image_latent:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 1
      num_inference_steps: 50
      pooling: "mean"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 4096
        aria_bimanual: 4096
      model:
        _target_: egowam.models.dit_image_decoder.DiTImageDecoder
        lat_channels: 16
        lat_h: 16
        lat_w: 16
        patch_size: 2
        hidden_dim: 384
        n_blocks: 6
        n_heads: 6
        mlp_ratio: 4.0
        dropout: 0.0
        obs_dim: 256
        time_dim: 256
    shared_future_flow:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 1
      num_inference_steps: 50
      pooling: "mean"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 2240
        aria_bimanual: 2240
      model:
        _target_: egowam.models.dit_image_decoder.DiTImageDecoder
        lat_channels: 2
        lat_h: 28
        lat_w: 40
        patch_size: 2
        hidden_dim: 256
        n_blocks: 4
        n_heads: 4
        mlp_ratio: 4.0
        dropout: 0.0
        obs_dim: 256
        time_dim: 256

  encoder_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    right_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    left_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5

# EVA + Aria cotrain with a single shared point-flow head. Uses hpt_wm.HPT
# (world-model variant) rather than the generic cotrain base because the
# point-flow heads are auxiliary WM heads.
#
# NOTE: this is the structural scaffold. Depending on your data config you may
# need to tune stem_specs for aria_bimanual (the aria stem_specs block below
# mirrors the existing cotrain defaults but users should confirm input_dim
# matches their aria proprio layout).
_target_: egowam.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egowam.algo.hpt_wm.HPT
  data_schematic: _${data.dataset.data_schematic}
  camera_transforms:
    eva_bimanual:
      _target_: egowam.utils.egowamUtils.CameraTransforms
      intrinsics_key: "base"
      extrinsics_key: "x5Dec13_2"
    aria_bimanual:
      _target_: egowam.utils.egowamUtils.CameraTransforms
      intrinsics_key: "base"
      extrinsics_key: "x5Dec13_2"

  diffusion: true
  6dof: true

  ac_keys:
    eva_bimanual: "actions_cartesian"
    aria_bimanual: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  auxiliary_ac_keys:
    eva_bimanual: ["future_flow_3d_points"]
    aria_bimanual: ["future_flow_3d_points"]
  auxiliary_loss_weights:
    future_ee_pose: 0.0
    future_image_latent: 0.0
    future_flow: 0.0
    future_flow_2d_points: 0.0
    future_flow_3d_points: 1.0
  future_proprio_key: "future_ee_pose"
  future_image_keys: ["future_front_img_1"]
  future_image_latent_key: "future_image_latent"
  future_flow_key: "future_flow"
  future_image_resize: 128
  wm_prediction_mode: "joint"
  teacher_forcing_ratio: 1.0
  training_stage: 3

  use_shared_vae_stem: false
  vae_stem_projection: "linear"
  # 3D point-flow decoder is standalone (no image latent) -> no VAE/RAE encoder.
  # auxiliary_ac_keys below lists only future_flow_3d_points, so _has_future_image_head is
  # False and HPT returns before ever calling cosmos_vae.encode(). Building the Cosmos VAE
  # here only added a gated-repo dependency for a head that is switched off; verified by a
  # paired debug run where 36/38 metrics were bit-identical (rest ~1e-7, float32 rounding).
  cosmos_vae: null

  kinematics_solver:
    _target_: egowam.robot.eva.eva_kinematics.EvaMinkKinematicsSolver
    model_path: ${paths.work_dir}/egowam/resources/model_x5.xml

  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: "joint_token"
    observation_horizon: 1
    action_horizon: 64
    future_horizon: 16
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8

  domains: ["eva_bimanual", "aria_bimanual"]
  # Domains that receive action (BC) supervision. null => all domains (legacy).
  # Set to ["eva_bimanual"] to cotrain human (aria) for flow supervision only.
  action_domains: null
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256

  stem_specs:
    eva_bimanual:
      left_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      right_wrist_img:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
    aria_bimanual:
      state_ee_pose:
        _target_: egowam.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    # Per-domain action heads (shared below)
    eva_bimanual: null
    aria_bimanual: null
    shared:
      _target_: egowam.models.fm_policy.FMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 14
        aria_bimanual: 14
      model:
        _target_: egowam.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    # Per-domain aux heads stay null; shared_* win via _resolve_aux_head_key.
    eva_bimanual_future_flow_3d_points: null
    aria_bimanual_future_flow_3d_points: null
    eva_bimanual_future_flow_2d_points: null
    aria_bimanual_future_flow_2d_points: null
    shared_future_flow_3d_points:
      _target_: egowam.models.fm_policy.PointFMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: [100, 512, 3]
        aria_bimanual: [100, 512, 3]
      model:
        _target_: egowam.models.point_flow_decoder.PointFlowDecoder
        num_points: 512
        point_dim: 3
        action_horizon: 100
        cond_dim: 256
        hidden_dim: 256
        n_blocks: 4
        n_heads: 4
        mlp_ratio: 4.0
        dropout: 0.0
        time_dim: 256
    shared_future_flow_2d_points:
      _target_: egowam.models.fm_policy.PointFMPolicy
      prediction_type: "v_prediction"
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: [100, 512, 2]
        aria_bimanual: [100, 512, 2]
      model:
        _target_: egowam.models.point_flow_decoder.PointFlowDecoder
        num_points: 512
        point_dim: 2
        action_horizon: 100
        cond_dim: 256
        hidden_dim: 256
        n_blocks: 4
        n_heads: 4
        mlp_ratio: 4.0
        dropout: 0.0
        time_dim: 256

  encoder_specs:
    front_img_1:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    right_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256
    left_wrist_img:
      _target_: egowam.models.hpt_nets.ResNet
      output_dim: 256

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5
